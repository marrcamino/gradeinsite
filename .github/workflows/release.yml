# Build both halves of a GradeInsite release and attach them to the tag.
#
# Instructors get an installer for the desktop app. The one computer acting as
# the school server gets a zip with the portal, the API, the migrations and a
# setup script — the API is in this repository, but a release needs it as a
# folder somebody can drop onto a server, not as source to check out.
#
#   git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags: ['v*']
  # So the packaging can be exercised without cutting a release.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Cargo's registry and the Tauri build both take minutes from cold.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build the server package
        shell: pwsh
        run: ./scripts/package-server.ps1

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the desktop app
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Attach everything to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GradeInsite-Server-*.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          body: |
            ## What to download

            | You are setting up | Download |
            | --- | --- |
            | An instructor's computer | `GradeInsite_x.x.x_x64-setup.exe` |
            | The school server (one computer only) | `GradeInsite-Server-x.x.x.zip` |

            ### The instructor's computer

            Run the installer. Open GradeInsite, choose **Where is the server?**
            on the sign-in screen, and type the address the server setup printed.

            The installer needs the internet **once**, and only on a computer
            that has never run an app built this way -- it fetches Microsoft's
            WebView2 runtime, which draws the app's screens. Windows 11 already
            has it, and so does Windows 10 with a current version of Edge, so on
            most computers nothing is downloaded at all. The app itself never
            uses the internet, before or after.

            If you are installing on a computer with no internet and the
            installer stops asking for WebView2, install Microsoft's own
            "Evergreen Standalone Installer" first, from
            https://developer.microsoft.com/microsoft-edge/webview2/ -- then run
            this installer again.

            ### The school server

            Unzip `GradeInsite-Server-x.x.x.zip` and double-click
            **Setup GradeInsite Server.bat**. It needs XAMPP (Apache and PHP
            only) and MySQL 8.4 already installed, and it will say so if either
            is missing. Write down the address it prints at the end -- that is
            what students open in a browser and what instructors type into the
            app.

            Running it again with a newer release upgrades the server and keeps
            the grades already on it.

      # A manual run still leaves the artifacts to download and try.
      - name: Keep the artifacts on a manual run
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: gradeinsite-${{ github.sha }}
          path: |
            dist/GradeInsite-Server-*.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
