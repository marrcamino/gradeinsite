# Build both halves of a GradeInsite release and attach them to the tag.
#
# Instructors get an installer for the desktop app. The one computer acting as
# the school server gets a zip with the portal, the API, the migrations and a
# setup script — the API is in this repository, but a release needs it as a
# folder somebody can drop onto a server, not as source to check out.
#
#   git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags: ['v*']
  # So the packaging can be exercised without cutting a release.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Cargo's registry and the Tauri build both take minutes from cold.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build the server package
        shell: pwsh
        run: ./scripts/package-server.ps1

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build the desktop app
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Attach everything to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GradeInsite-Server-*.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true

      # A manual run still leaves the artifacts to download and try.
      - name: Keep the artifacts on a manual run
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: gradeinsite-${{ github.sha }}
          path: |
            dist/GradeInsite-Server-*.zip
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
